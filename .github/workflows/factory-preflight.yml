name: Factory read-only preflight (not execution)
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Existing PR number
        required: true
        type: string
      expected_head:
        description: Exact 40-character PR head SHA
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: factory-preflight
  cancel-in-progress: false
jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/factory
      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_HEAD: ${{ inputs.expected_head }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const n=process.env.PR_NUMBER;
            if(!/^[1-9][0-9]*$/.test(n)) throw Error('Invalid PR number');
            const params={...context.repo,pull_number:Number(n)};
            const permission=await github.rest.repos.getCollaboratorPermissionLevel({...context.repo,username:process.env.TRIGGERING_ACTOR});
            const {data:pr}=await github.rest.pulls.get(params);
            if(pr.changed_files>300) throw Error('More than 300 changed files require manual review');
            const {data:comparison}=await github.rest.repos.compareCommitsWithBasehead({...context.repo,basehead:pr.base.sha+'...'+pr.head.sha,per_page:1});
            const files=comparison.files;
            const {data:tree}=await github.rest.git.getTree({...context.repo,tree_sha:pr.head.sha,recursive:'1'});
            const {inspect}=require(process.env.GITHUB_WORKSPACE+'/scripts/factory/preflight.cjs');
            const result=inspect({repository:context.repo.owner+'/'+context.repo.repo,ref:context.ref,actorPermission:permission.data.permission,pr,expectedHead:process.env.EXPECTED_HEAD,files,tree});
            // Re-read for races. Never check out head, execute target code, consume artifacts or post comments.
            const {data:latest}=await github.rest.pulls.get(params);
            if(latest.head.sha!==pr.head.sha||latest.base.sha!==pr.base.sha||latest.state!=='open') throw Error('PR changed during inspection');
            if(!result.admitted) throw Error(result.errors.join('; '));
            await core.summary.addHeading('Read-only preflight passed').addRaw('Metadata only. No Claude run, acceptance, merge or deployment.').write();
