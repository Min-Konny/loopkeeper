name: Dashboard screenshots
on:
  push:
    branches: [codex/dashboard-visual-check]
permissions:
  contents: read
jobs:
  viewport:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d451a3bfe1b24d7e80d3fa24e4655a2b0f4651bc
          path: before
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 4a38299f65b4ae9aae29f2893005466655b8f25e
          path: after
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test and build reconciled dashboard
        working-directory: after
        run: |
          npm test
          npm run build
      - name: Verify layout in fresh browser contexts
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          npm install --ignore-scripts --no-save playwright@1.52.0
          mkdir -p dashboard-evidence
          PORT=4173 node before/server.mjs &
          PORT=4174 node after/server.mjs &
          node scripts/dashboard-visual-check.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dashboard-4a38299f65b4ae9aae29f2893005466655b8f25e
          path: dashboard-evidence/
