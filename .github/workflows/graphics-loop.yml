name: Graphics Claude Codex Loop (activation required)
on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Create the state branch once after reviewed activation
        type: boolean
        default: false
      request_review:
        description: Mark the pending draft ready again without calling Claude
        type: boolean
        default: false
      proposal_run:
        description: Explicit reconciled successful-generation run to reverify without calling Claude
        type: string
        default: ''
  schedule:
    - cron: '17,47 * * * *'
permissions: {}
concurrency:
  group: minimal-factory-${{ github.repository }}
  cancel-in-progress: false
jobs:
  gate:
    if: vars.GRAPHICS_LOOP_ENABLED == 'true' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
      issues: read
      pull-requests: read
    outputs:
      review_node: ${{ steps.gate.outputs.review_node }}
      artifact_id: ${{ steps.gate.outputs.artifact_id }}
      artifact_run: ${{ steps.gate.outputs.artifact_run }}
      run: ${{ steps.gate.outputs.run }}
      manifest: ${{ steps.gate.outputs.manifest }}
      prompt: ${{ steps.gate.outputs.prompt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/factory/graphics-loop.cjs
            /scripts/factory/graphics-catalog.json
      - id: gate
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          REQUEST_REVIEW: ${{ inputs.request_review }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
          PROPOSAL_RUN: ${{ inputs.proposal_run }}
        with:
          script: |
            await require('./scripts/factory/graphics-loop.cjs').gate({github,context,core,catalog:require('./scripts/factory/graphics-catalog.json')});
  request-review:
    needs: gate
    if: needs.gate.outputs.review_node != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/factory/graphics-loop.cjs
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          REVIEW_NODE: ${{ needs.gate.outputs.review_node }}
        with:
          script: |
            const id = process.env.REVIEW_NODE;
            const result = await github.graphql('query($id:ID!){node(id:$id){... on PullRequest{isDraft}}}', {id});
            if (result.node?.isDraft !== true) throw Error('Convert the pending PR to draft before retrying');
            await require('./scripts/factory/graphics-loop.cjs').markReady(github,id);
  generate:
    needs: gate
    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.artifact_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # Deliberately NO checkout: no repository hooks, CLAUDE.md, skills or MCP configuration.
      - name: Retrieve trusted launcher and verifier only
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs=require('node:fs');fs.mkdirSync(process.env.RUNNER_TEMP+'/factory-sdk');
            for(const name of ['failure-category.cjs','graphics-loop.cjs','action-launcher.cjs','claude-launcher.cjs','action-result.cjs','action-cli-probe.cjs','sdk/package.json','sdk/package-lock.json']){
              const {data:f}=await github.rest.repos.getContent({...context.repo,path:'scripts/factory/'+name,ref:context.sha});
              const destination=name.startsWith('sdk/')?'/factory-sdk/'+name.slice(4):'/'+name;
              fs.writeFileSync(process.env.RUNNER_TEMP+destination,Buffer.from(f.content,'base64'),{flag:'wx'});
            }
            fs.chmodSync(process.env.RUNNER_TEMP+'/claude-launcher.cjs',0o700);
      - name: Recheck checkpoint before credential use
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          MANIFEST: ${{ needs.gate.outputs.manifest }}
        with:
          script: |
            await require(process.env.RUNNER_TEMP+'/graphics-loop.cjs').recheck({github,context,manifest:JSON.parse(process.env.MANIFEST)});
      - name: Install locked official CLI package without scripts
        run: npm ci --prefix "$RUNNER_TEMP/factory-sdk" --ignore-scripts --no-audit --no-fund
      - name: Verify real CLI zero-tool initialization without authentication
        env:
          FACTORY_SDK_ROOT: ${{ runner.temp }}/factory-sdk
        run: node "$RUNNER_TEMP/action-cli-probe.cjs"
      - name: Refuse debug output and API fallback
        env:
          API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        run: |
          test "${ACTIONS_STEP_DEBUG:-false}" != true
          test -z "$API_KEY"
      - name: Initialize empty Action bookkeeping repository (no candidate checkout)
        run: git init
      - name: Generate source proposal with official Claude Code Action
        id: claude
        uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # reviewed v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          path_to_claude_code_executable: ${{ runner.temp }}/claude-launcher.cjs
          prompt: ${{ needs.gate.outputs.prompt }}
          claude_args: >-
            --tools=""
            --disallowedTools "*"
            --setting-sources user
            --strict-mcp-config
            --mcp-config '{"mcpServers":{}}'
            --disable-slash-commands
            --settings '{"disableAllHooks":true}'
            --max-turns 2
            --model claude-fable-5-2
          settings: '{"disableAllHooks":true}'
          use_commit_signing: 'false'
          classify_inline_comments: 'false'
          display_report: 'false'
          show_full_output: 'false'
          plugins: ''
          plugin_marketplaces: ''
      - name: Classify failure without exposing response or credentials
        if: failure() && steps.claude.outcome == 'failure'
        env:
          FACTORY_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node "$RUNNER_TEMP/failure-category.cjs"
      - name: Verify actual model and zero-tool evidence, then admit plain JSON
        env:
          FACTORY_EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
          FACTORY_EXPECTED_MODEL: claude-fable-5-2
        run: node "$RUNNER_TEMP/action-result.cjs"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: proposal-${{ github.run_id }}-1
          path: ${{ runner.temp }}/proposal.json
          if-no-files-found: error
          retention-days: 1
  verify:
    needs: [gate, generate]
    if: always() && needs.gate.result == 'success' && needs.gate.outputs.run == 'true' && (needs.generate.result == 'success' || (needs.generate.result == 'skipped' && needs.gate.outputs.artifact_id != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check out pinned integration baseline without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ fromJSON(needs.gate.outputs.manifest).base }}
          path: candidate
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.gate.outputs.artifact_id || needs.generate.outputs.artifact_id }}
          run-id: ${{ needs.gate.outputs.artifact_run || github.run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/proposal
      - name: Normalize proposal using trusted control code
        env:
          MANIFEST: ${{ needs.gate.outputs.manifest }}
        run: |
          node - <<'JS'
          const fs=require('node:fs'),m=JSON.parse(process.env.MANIFEST),dir=process.env.RUNNER_TEMP+'/proposal';
          if(fs.readdirSync(dir).join()!=='proposal.json'||!fs.lstatSync(dir+'/proposal.json').isFile())throw Error('Unexpected artifact files');
          const raw=fs.readFileSync(dir+'/proposal.json','utf8');
          const normalized=require('./scripts/factory/graphics-loop.cjs').normalize(raw,m.paths);
          fs.writeFileSync(process.env.RUNNER_TEMP+'/validated.json',normalized,{flag:'wx'});
          for(const f of [...m.sources,...JSON.parse(normalized).files]){const target='candidate/'+f.path,s=fs.lstatSync(target);if(!s.isFile()||s.isSymbolicLink())throw Error('Unexpected target');fs.writeFileSync(target,f.content);}
          JS
      # The one executable-fixture test runs in ordinary source CI; /tmp is deliberately noexec here.
      - name: Isolated regression signal, not independent acceptance
        run: |
          docker pull node:24-bookworm
          image=$(docker image inspect node:24-bookworm --format '{{.Id}}')
          timeout 180 docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 2g --cpus 2 --user 65534:65534 --tmpfs /tmp:rw,noexec,nosuid,nodev,size=256m --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/source,readonly" -w /source/candidate "$image" bash -c 'node --test --test-skip-pattern="^spawn uses fresh dirs, clean env and removes them; no real CLI/model$" tests/*.test.mjs tests/*.test.js'
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: validated-${{ github.run_id }}-1
          path: ${{ runner.temp }}/validated.json
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [gate, verify]
    if: always() && needs.gate.result == 'success' && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/factory/graphics-loop.cjs
            /scripts/factory/graphics-catalog.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/validated
      - name: Publish normalized data and mark the PR ready for review
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          MANIFEST: ${{ needs.gate.outputs.manifest }}
        with:
          script: |
            const fs=require('node:fs'),dir=process.env.RUNNER_TEMP+'/validated';
            if(fs.readdirSync(dir).join()!=='validated.json'||!fs.lstatSync(dir+'/validated.json').isFile())throw Error('Unexpected validated artifact');
            await require('./scripts/factory/graphics-loop.cjs').publish({github,context,manifest:JSON.parse(process.env.MANIFEST),raw:fs.readFileSync(dir+'/validated.json','utf8')});
