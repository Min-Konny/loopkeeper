<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151e1e" />
    <meta name="description" content="採り、鍛え、襲撃に備える。失った命の経験を次へつなぐ、資源管理ローグライト。" />
    <title>LoopKeeper: Idle Defense</title>
    <link rel="icon" href="./assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles.css?v=0.3.8" />
    <link rel="stylesheet" href="./src/augments.css?v=0.3.8" />
    <link rel="stylesheet" href="./src/battle.css" />
    <link rel="stylesheet" href="./src/motion.css" />
    <link rel="stylesheet" href="./src/legacy.css" />
    <link rel="stylesheet" href="./src/dashboard.css?v=0.3.8" />
  </head>
  <body>
    <div id="app"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="battle-dialog" aria-labelledby="battle-title"></dialog>
    <dialog id="augment-dialog" aria-labelledby="augment-title"></dialog>
    <dialog id="help-dialog" aria-labelledby="help-title"></dialog>
    <dialog id="save-dialog" aria-labelledby="save-title"></dialog>
    <dialog id="updates-dialog" aria-labelledby="updates-title"></dialog>
    <dialog id="settings-dialog" aria-labelledby="settings-title"></dialog>
    <dialog id="death-dialog" aria-labelledby="death-title"></dialog>
    <input id="import-input" type="file" accept="application/json,.json" hidden />
    <script type="module">
      const entry = "./src/main.js?v=0.3.8";
      const version = new URL(entry, location.href).searchParams.get("v");
      const url = new URL(location.href);
      if (url.searchParams.has("v") && url.searchParams.get("v") !== version) {
        url.searchParams.set("v", version);
        location.replace(url.href);
      } else {
        import(entry);
      }
    </script>
  </body>
</html>
