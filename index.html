<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#151e1e" />
    <meta name="description" content="採り、鍛え、襲撃に備える。失った命の経験を次へつなぐ、資源管理ローグライト。" />
    <title>LoopKeeper: Idle Defense</title>
    <link rel="icon" href="./assets/mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./src/styles.css?v=0.6.124" />
    <link rel="stylesheet" href="./src/augments.css?v=0.6.124" />
    <link rel="stylesheet" href="./src/battle.css" />
    <link rel="stylesheet" href="./src/motion.css" />
    <link rel="stylesheet" href="./src/legacy.css" />
    <link rel="stylesheet" href="./src/dashboard.css?v=0.6.124" />
  <link rel="stylesheet" href="./src/camp-polish.css?v=0.6.124" />
    <link rel="stylesheet" href="./src/camp-space.css?v=0.6.124" />
  <link rel="stylesheet" href="./src/pixel-camp.css?v=0.6.124" />
<link rel="stylesheet" href="./src/decision-ui.css?v=0.6.124">
    <link rel="stylesheet" href="./src/route-ui.css?v=0.6.124" />
    <link rel="stylesheet" href="./src/inheritance-map.css?v=0.6.124">
<link rel="stylesheet" href="./src/camp-status.css?v=0.6.124">
<link rel="stylesheet" href="./src/quests.css?v=0.6.124"><link rel="stylesheet" href="./src/interface.css?v=0.6.124" />
    <style>
      .boot-screen{box-sizing:border-box;max-width:480px;margin:12vh auto;padding:24px;border:1px solid #657052;border-radius:12px;background:#1c2d25;color:#eee9d3;font:16px/1.7 system-ui,sans-serif;width:calc(100% - 32px)}
      .boot-screen h1{font-size:24px;margin:0 0 12px}.boot-screen p{font-size:14px;margin:8px 0;color:#c7d0bf}.boot-screen button{font:inherit;min-height:44px;padding:8px 18px;margin-top:12px;background:#c9ae68;color:#17251c;border:1px solid #ebd49b;border-radius:8px;cursor:pointer}.boot-screen button:focus-visible{outline:3px solid #ebd49b;outline-offset:4px}
    </style>
  </head>
  <body>

    <div id="app"><section id="boot-state" class="boot-screen" role="status" aria-live="polite"><h1>LoopKeeper</h1><p>ゲームを読み込んでいます。</p><p data-boot-detail>回線が遅い場合は、起動まで少し時間がかかります。</p><noscript><p>起動にはJavaScriptが必要です。</p></noscript></section></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="battle-dialog" aria-labelledby="battle-title"></dialog>
    <dialog id="augment-exclude-dialog" aria-labelledby="augment-exclude-title"></dialog>
<dialog id="augment-dialog" aria-labelledby="augment-title"></dialog>
    <dialog id="help-dialog" aria-labelledby="help-title"></dialog>
    <dialog id="save-dialog" aria-labelledby="save-title"></dialog>
    <dialog id="updates-dialog" aria-labelledby="updates-title"></dialog>
    <dialog id="settings-dialog" aria-labelledby="settings-title"></dialog>
    <dialog id="reset-dialog" aria-labelledby="reset-title"></dialog>
    <dialog id="death-dialog" aria-labelledby="death-title"></dialog>
    <input id="import-input" type="file" accept="application/json,.json" hidden />
    <script type="module">
      const entry = "./src/main.js?v=0.6.124";
      const version = new URL(entry, location.href).searchParams.get("v");
      const url = new URL(location.href);
      if (url.searchParams.has("v") && url.searchParams.get("v") !== version) {
        url.searchParams.set("v", version);
        location.replace(url.href);
      } else {
        const slow = setTimeout(() => {
          const detail = document.querySelector('#boot-state [data-boot-detail]');
          if (detail) detail.textContent = '読み込みに時間がかかっています。通信が安定しているか確認してください。';
        }, 15000);
        import(entry).then(() => clearTimeout(slow)).catch(error => {
          clearTimeout(slow);
          console.error('LoopKeeper startup failed', error);
          let panel = document.getElementById('boot-state');
          if (!panel) { panel = document.createElement('section'); panel.className = 'boot-screen'; document.body.prepend(panel); }
          panel.setAttribute('role', 'alert');
          panel.replaceChildren();
          const title = document.createElement('h1'); title.textContent = '読み込みを完了できませんでした';
          const detail = document.createElement('p'); detail.textContent = '通信を確認して、再読み込みしてください。';
          const button = document.createElement('button'); button.type = 'button'; button.textContent = '再読み込み';
          button.addEventListener('click', () => location.reload());
          panel.append(title, detail, button);
        });
      }
    </script>
  </body>
</html>
